<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Kettia private message</title>

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0b2e 50%, #0f172a 100%);
            overflow-x: hidden;
            position: relative;
            color: #f0f0f5;
        }

        /* Particle Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Floating Elements */
        .floating-element {
            position: fixed;
            pointer-events: none;
            z-index: 2;
            font-size: 1.4rem;
            animation: floatUp linear forwards;
            filter: drop-shadow(0 0 5px rgba(255,182,193,0.5));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Glow Orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 20s infinite ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,107,157,0.4) 0%, transparent 70%); top: -100px; left: -100px; }
        .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(192,132,252,0.3) 0%, transparent 70%); bottom: -150px; right: -150px; animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%); top: 50%; left: 50%; animation-delay: -10s; }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            25% { transform: translate(40px,-40px) scale(1.1); }
            50% { transform: translate(-30px,30px) scale(0.9); }
            75% { transform: translate(30px,20px) scale(1.05); }
        }

        /* Main Container */
        .app-wrapper {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Glass Card */
        .glass-card {
            background: rgba(20, 20, 45, 0.88);
            backdrop-filter: blur(25px);
            border-radius: 44px;
            border: 1px solid rgba(255, 200, 220, 0.35);
            box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 80px rgba(255,107,157,0.15);
            width: 100%;
            max-width: 580px;
            transition: transform 0.2s ease-out;
            transform-style: preserve-3d;
            animation: cardEntrance 0.8s cubic-bezier(0.2,0.9,0.4,1.1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(50px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-inner {
            padding: 38px 30px;
        }

        /* Live Clock */
        .live-clock {
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }

        /* Password Screen */
        .lock-icon {
            text-align: center;
            font-size: 4.8rem;
            margin-bottom: 20px;
            animation: heartbeat 2s ease infinite, floatIcon 3s ease infinite;
            filter: drop-shadow(0 10px 25px rgba(255,107,157,0.5));
        }

        @keyframes heartbeat {
            0%,100% { transform: scale(1); }
            25% { transform: scale(1.08); }
            50% { transform: scale(1); }
            75% { transform: scale(1.05); }
        }

        @keyframes floatIcon {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .title-luxury {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            font-weight: 400;
            text-align: center;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4, #C084FC, #FFD700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 300% 300%;
            animation: gradientShift 5s ease infinite;
            margin-bottom: 12px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.6);
            margin-bottom: 32px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .password-field {
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(255,107,157,0.4);
            border-radius: 60px;
            padding: 16px 24px;
            width: 100%;
            color: white;
            font-size: 1rem;
            font-family: monospace;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .password-field:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 25px rgba(255,105,180,0.4);
            transform: scale(1.01);
        }

        .btn-luxury {
            background: linear-gradient(135deg, #ff6b9d, #c084fc, #ff6b9d);
            background-size: 200% auto;
            border: none;
            border-radius: 60px;
            padding: 16px;
            width: 100%;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(255,107,157,0.4);
        }

        .btn-luxury:hover {
            transform: translateY(-2px);
            background-position: right center;
            box-shadow: 0 12px 35px rgba(255,107,157,0.5);
        }

        .error-msg {
            color: #ff8888;
            text-align: center;
            font-size: 0.8rem;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .error-msg.show {
            opacity: 1;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Loading Screen */
        .carousel-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            overflow: hidden;
            margin: 20px 0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,200,220,0.3);
        }

        .carousel-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .carousel-img.active {
            opacity: 1;
        }

        .spinner {
            width: 70px;
            height: 70px;
            margin: 20px auto;
            position: relative;
        }

        .spinner::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, #ff6b9d, #c084fc, #ffd700, #ff6b9d);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            mask: radial-gradient(farthest-side, transparent calc(100% - 8px), black calc(100% - 6px));
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #c084fc);
            width: 0%;
            transition: width 0.1s linear;
        }

        .countdown {
            text-align: center;
            font-family: monospace;
            font-size: 1.3rem;
            color: #ff99cc;
            font-weight: bold;
        }

        /* Message Screen */
        .recipient-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            text-align: center;
            background: linear-gradient(135deg, #FFB6C1, #FF69B4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .message-badge {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            background: rgba(255,107,157,0.2);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.7rem;
            border: 1px solid rgba(255,107,157,0.4);
        }

        .message-content {
            font-size: 1rem;
            line-height: 1.9;
            white-space: pre-wrap;
            min-height: 420px;
            color: rgba(255,255,255,0.9);
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #ff99cc;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Reply Section */
        .reply-choice {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,200,220,0.2);
            text-align: center;
        }

        .choice-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn-choice {
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            color: white;
        }

        .btn-no {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.7);
        }

        .reply-form {
            margin-top: 24px;
            display: none;
        }

        .reply-textarea {
            width: 100%;
            min-height: 120px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,107,157,0.3);
            border-radius: 20px;
            padding: 16px;
            color: white;
            font-size: 0.95rem;
            resize: vertical;
            margin-bottom: 16px;
        }

        .reply-textarea:focus {
            outline: none;
            border-color: #ff6b9d;
        }

        .reply-actions {
            display: flex;
            gap: 12px;
        }

        .btn-send {
            flex: 1;
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            border: none;
            border-radius: 50px;
            padding: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            padding: 12px 24px;
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
        }

        .success-message, .silent-ending {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .success-icon { font-size: 4rem; margin-bottom: 16px; }
        .success-title { font-size: 1.3rem; color: #86efac; margin-bottom: 8px; }
        .silent-icon { font-size: 3rem; margin-bottom: 16px; }

        /* Candle */
        .candle-container {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 100;
            text-align: center;
            cursor: pointer;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 50px;
        }

        .candle {
            font-size: 2rem;
            filter: drop-shadow(0 0 15px #ffaa66);
            animation: flicker 2s infinite;
        }

        @keyframes flicker {
            0%,100% { filter: drop-shadow(0 0 10px #ffaa66); }
            50% { filter: drop-shadow(0 0 20px #ff8844); }
        }

        /* Footer */
        .dev-footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,220,240,0.5);
            border-top: 1px solid rgba(255,200,220,0.15);
            padding-top: 20px;
        }

        .dev-footer a {
            background: linear-gradient(90deg, #ffadd2, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 550px) {
            .card-inner { padding: 28px 20px; }
            .title-luxury { font-size: 1.8rem; }
            .recipient-name { font-size: 1.5rem; }
            .message-content { font-size: 0.9rem; line-height: 1.7; }
            .choice-buttons { flex-direction: column; }
            .btn-choice { width: 100%; }
        }
    </style>
</head>

<div class="candle-container" id="candleToggle">

</div>

<script>
    // ========== CONFIGURATION ==========
    const PASSWORD = "kabar@2026";
    const RECIPIENT_NAME = "Kettia";
    
    // YOUR LATEST GOOGLE APPS SCRIPT URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyVpRYo-TXUrLzzq9dr1QRVkqF9s4J5KSOKwBRm41KD-6GSkQ7W7eoYnRFFBj1F7U4/exec";
    
    // ========== BEAUTIFUL, LOVABLE IMAGES FOR MOMENTS ==========
    // These images represent love, connection, sunset, togetherness, and beautiful memories
    const IMAGES = [
        "https://images.pexels.com/photos/2064331/pexels-photo-2064331.jpeg?auto=compress&cs=tinysrgb&w=800",
        "https://images.pexels.com/photos/1556691/pexels-photo-1556691.jpeg?auto=compress&cs=tinysrgb&w=800",
        "https://images.pexels.com/photos/2380794/pexels-photo-2380794.jpeg?auto=compress&cs=tinysrgb&w=800",
        "https://images.pexels.com/photos/1468379/pexels-photo-1468379.jpeg?auto=compress&cs=tinysrgb&w=800",
        "https://images.pexels.com/photos/2690323/pexels-photo-2690323.jpeg?auto=compress&cs=tinysrgb&w=800",
        "https://images.pexels.com/photos/210922/pexels-photo-210922.jpeg?auto=compress&cs=tinysrgb&w=800",
        "https://images.pexels.com/photos/1024967/pexels-photo-1024967.jpeg?auto=compress&cs=tinysrgb&w=800",
        "https://images.pexels.com/photos/1686931/pexels-photo-1686931.jpeg?auto=compress&cs=tinysrgb&w=800"
    ];
    
    const MESSAGE_TEXT = `Hello Kettia,

I hope you're doing okay.

I made this little website because I wanted to talk to you in a real and honest way — to tell you something deeper than just normal messages.

What we had really meant a lot to me. I still think about the time we spent together — our visits, our chats, the jokes, the way we laughed, and even the small moments of closeness we shared.

With you, I didn't have to pretend. I could just be myself, and that felt rare and special.

I know I didn't always show how much those moments meant to me, but the truth is… they meant more than I ever said.

But as time went on, things changed. We didn't talk like we used to anymore. The connection between us started to feel weaker and more distant.

I kept hoping it was just temporary, that things would go back to how they were before, but they didn't. And little by little, it started to hurt me.

I've taken time to really think about us, deeply and honestly. And I've come to accept something difficult… what we had is slowly fading.

Holding on like this, when things are no longer the same between us, is starting to hurt more than it brings peace. And I don't think it's fair for either of us to keep going like this.

You deserve someone who is truly there for you every day — someone present, someone who gives you real time, real attention, and real love. Not something that only lives in memories or comes and goes through messages.

I'm not angry at you, not at all. And I don't regret what we shared — those moments were real, and they will always matter to me. But I believe the best thing we can do now is to let each other go, and give ourselves the chance to find happiness again, even if that means walking separate paths.

I truly wish you the best in everything. You deserve happiness, peace, and something real.

Take care of yourself, Kettia. Maybe one day, we'll meet again and smile about what we once had.

With respect and care,
Chris`;
    
    // ========== GLOBAL STATE ==========
    let currentScreen = "password";
    let carouselInterval = null;
    let countdownInterval = null;
    let activeImgIndex = 0;
    let candleLit = false;
    
    const containerEl = document.getElementById("dynamicContent");
    
    // ========== PARTICLE SYSTEM ==========
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.5 + 0.8;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = (Math.random() - 0.5) * 0.3;
            this.color = `hsl(${Math.random() * 60 + 300}, 70%, 65%)`;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
    }
    
    for (let i = 0; i < 70; i++) particles.push(new Particle());
    
    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();
    
    // ========== FLOATING ELEMENTS ==========
    const floatEmojis = ['🌸', '💖', '🌹', '✨', '💕', '🦋', '💗', '🌺', '💝', '⭐', '🌙', '💫'];
    setInterval(() => {
        const el = document.createElement('div');
        el.className = 'floating-element';
        el.textContent = floatEmojis[Math.floor(Math.random() * floatEmojis.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.animationDuration = (8 + Math.random() * 6) + 's';
        el.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 14000);
    }, 1000);
    
    // ========== CANDLE ==========
    document.getElementById('candleToggle').addEventListener('click', () => {
        candleLit = !candleLit;
        const candleEl = document.querySelector('.candle');
        if (candleLit) {
            candleEl.textContent = '🔥';
            candleEl.style.filter = 'drop-shadow(0 0 30px #ff6600)';
        } else {
            candleEl.textContent = '🕯️';
            candleEl.style.filter = 'drop-shadow(0 0 15px #ffaa66)';
        }
    });
    
    // ========== RENDER FUNCTIONS ==========
    function renderDevFooter() {
        return `<div class="dev-footer">✨ Developed by <a href="https://stomcodev.github.io/TUYISENGE-Jean-Chrisostom/" target="_blank">TUYISENGE Jean Chrisostom</a> ✨</div>`;
    }
    
    function updateClock() {
        const clock = document.getElementById('liveClock');
        if (clock) {
            clock.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
    }
    
    // Password Screen
    function renderPasswordScreen() {
        containerEl.innerHTML = `
            <div class="card-inner">
                <div class="live-clock" id="liveClock"></div>
                <div class="lock-icon">🔐💖</div>
                <h1 class="title-luxury">Private message</h1>
                <p class="subtitle">Enter your private message password</p>
                <input type="password" id="passwordInput" class="password-field" placeholder="Enter Password" autocomplete="off">
                <button id="unlockBtn" class="btn-luxury">Open</button>
                <div id="errorMsg" class="error-msg">Wrong password. Try again.</div>
                ${renderDevFooter()}
            </div>
        `;
        setInterval(updateClock, 1000);
        updateClock();
        
        const input = document.getElementById('passwordInput');
        const btn = document.getElementById('unlockBtn');
        const error = document.getElementById('errorMsg');
        
        const verify = () => {
            if (input.value.trim() === PASSWORD) {
                btn.textContent = 'Opening... 🔓';
                setTimeout(() => {
                    currentScreen = 'loading';
                    render();
                    startLoadingSequence();
                }, 500);
            } else {
                error.classList.add('show');
                input.value = '';
                setTimeout(() => error.classList.remove('show'), 2000);
                input.focus();
            }
        };
        
        btn.onclick = verify;
        input.onkeypress = (e) => { if (e.key === 'Enter') verify(); };
        input.focus();
    }
    
    // Loading Sequence
    function startLoadingSequence() {
        let secondsLeft = 8;
        const countdownEl = document.getElementById('countdownNum');
        const progressEl = document.getElementById('progressFill');
        
        const imgs = document.querySelectorAll('.carousel-img');
        if (imgs.length) {
            imgs[0].classList.add('active');
            carouselInterval = setInterval(() => {
                imgs[activeImgIndex].classList.remove('active');
                activeImgIndex = (activeImgIndex + 1) % imgs.length;
                imgs[activeImgIndex].classList.add('active');
            }, 2000);
        }
        
        countdownInterval = setInterval(() => {
            secondsLeft--;
            if (countdownEl) countdownEl.innerText = secondsLeft;
            if (progressEl) progressEl.style.width = ((8 - secondsLeft) / 8 * 100) + '%';
            
            if (secondsLeft <= 0) {
                clearInterval(carouselInterval);
                clearInterval(countdownInterval);
                currentScreen = 'message';
                render();
                startTypingAnimation();
            }
        }, 1000);
    }
    
    function renderLoadingScreen() {
        containerEl.innerHTML = `
            <div class="card-inner">
                <div style="text-align:center; margin-bottom:16px;">
                    <span style="font-family: 'Playfair Display'; font-size:1.3rem;">✨ Our Beautiful Moments ✨</span>
                </div>
                <div class="carousel-container">
                    ${IMAGES.map(src => `<img class="carousel-img" src="${src}" loading="eager">`).join('')}
                </div>
                <div class="spinner"></div>
                <div class="progress-bar-container"><div class="progress-fill" id="progressFill"></div></div>
                <div class="countdown"><span id="countdownNum">8</span> seconds</div>
                ${renderDevFooter()}
            </div>
        `;
    }
    
    // Typing Animation
    function startTypingAnimation() {
        const msgEl = document.getElementById('messageText');
        if (!msgEl) return;
        let i = 0;
        function type() {
            if (i < MESSAGE_TEXT.length) {
                msgEl.innerHTML = MESSAGE_TEXT.substring(0, i + 1) + '<span class="typing-cursor"></span>';
                i++;
                setTimeout(type, 25);
            } else {
                msgEl.innerHTML = MESSAGE_TEXT;
                document.getElementById('replyChoice').style.display = 'block';
            }
        }
        type();
    }
    
    // ========== GOOGLE SHEETS SUBMIT ==========
    window.submitReply = async function() {
        const textarea = document.getElementById('replyText');
        const replyText = textarea.value.trim();
        
        if (!replyText) {
            textarea.style.borderColor = '#ef4444';
            setTimeout(() => textarea.style.borderColor = '', 1000);
            return;
        }
        
        const sendBtn = document.getElementById('sendBtn');
        sendBtn.textContent = 'Sending... 💌';
        sendBtn.disabled = true;
        
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    recipient: 'Kettia',
                    reply: replyText,
                    timestamp: new Date().toISOString()
                })
            });
        } catch (err) {
            console.log('Network issue, saved locally');
        }
        
        document.getElementById('replyForm').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
    };
    
    window.showReplyForm = function() {
        document.getElementById('replyChoice').style.display = 'none';
        document.getElementById('replyForm').style.display = 'block';
        document.getElementById('replyText').focus();
    };
    
    window.showSilentEnding = function() {
        document.getElementById('replyChoice').style.display = 'none';
        document.getElementById('silentEnding').style.display = 'block';
    };
    
    // Message Screen
    function renderMessageScreen() {
        containerEl.innerHTML = `
            <div class="card-inner">
                <div class="recipient-name">For ${RECIPIENT_NAME}</div>
                <div class="message-badge"><span class="badge">💌 Private message from Chris 💌</span></div>
                <div id="messageText" class="message-content"></div>
                
                <div id="replyChoice" class="reply-choice" style="display: none;">
                    <p>Would you like to send a reply?</p>
                    <div class="choice-buttons">
                        <button class="btn-choice btn-yes" onclick="window.showReplyForm()">Yes, I want to reply 💬</button>
                        <button class="btn-choice btn-no" onclick="window.showSilentEnding()">No, just read ✨</button>
                    </div>
                </div>
                
                <div id="replyForm" class="reply-form">
                    <textarea id="replyText" class="reply-textarea" placeholder="Write your thoughts here..."></textarea>
                    <div class="reply-actions">
                        <button id="sendBtn" class="btn-send" onclick="window.submitReply()">Send Reply 💌</button>
                        <button class="btn-cancel" onclick="document.getElementById('replyForm').style.display='none'; document.getElementById('replyChoice').style.display='block';">Cancel</button>
                    </div>
                </div>
                
                <div id="successMessage" class="success-message">
                    <div class="success-icon">❤️✨❤️</div>
                    <div class="success-title">Message Sent!</div>
                    <div class="success-text">Thank you for your reply. It means a lot.</div>
                </div>
                
                <div id="silentEnding" class="silent-ending">
                    <div class="silent-icon">🌙💫</div>
                    <div class="silent-text">"Sometimes the most beautiful goodbyes are the ones we hold quietly in our hearts."<br><br>Take care, Kettia. 💕</div>
                </div>
                
                ${renderDevFooter()}
            </div>
        `;
    }
    
    function render() {
        if (currentScreen === 'password') renderPasswordScreen();
        else if (currentScreen === 'loading') renderLoadingScreen();
        else if (currentScreen === 'message') renderMessageScreen();
    }
    
    // Start
    render();
    
    // Cleanup
    window.addEventListener('beforeunload', () => {
        if (carouselInterval) clearInterval(carouselInterval);
        if (countdownInterval) clearInterval(countdownInterval);
    });
</script>
</body>
</html>
